build:
  maxIssues: 0

style:
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  UnusedPrivateMember:
    # @Preview só é chamado pelo tooling do Compose, nunca por outro código.
    ignoreAnnotated: ["Preview"]

complexity:
  LongMethod:
    threshold: 80
  LongParameterList:
    active: false
  TooManyFunctions:
    thresholdInClasses: 15

naming:
  MatchingDeclarationName:
    # core:ui agrupa o enum/data class de estado de UI com o Composable correspondente
    # no mesmo arquivo (convenção comum em design systems Compose).
    active: false
  FunctionNaming:
    # Composables usam PascalCase (convenção do Compose), não a convenção padrão de função.
    ignoreAnnotated: ["Composable"]
  TopLevelPropertyNaming:
    active: true
