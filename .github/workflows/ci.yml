name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Spotless
        run: ./gradlew spotlessCheck --console=plain

      - name: Detekt
        run: ./gradlew detekt --console=plain

      - name: Lint
        run: ./gradlew :app:lint --console=plain

      - name: Testes unitários
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Cobertura (Kover)
        run: ./gradlew koverXmlReport --console=plain

      - name: Relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests
            **/build/reports/detekt
            **/build/test-results

  instrumented-tests:
    name: Testes instrumentados (Gradle Managed Devices)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Aceita as licenças do Android SDK
        uses: android-actions/setup-android@v3

      - name: Habilita KVM para o emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Testes instrumentados (pixel2api30, aosp-atd)
        run: ./gradlew pixel2api30DebugAndroidTest --console=plain

      - name: Testes E2E do :app (flavor mock, emulador real)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          channel: canary
          arch: x86_64
          script: ./gradlew :app:connectedMockDebugAndroidTest --console=plain
